# nginx vhost for the hosted Attach Open Score verdict API.
#
# This is the HTTP-only starting point. Install it, then run:
#   sudo certbot --nginx -d score.attach.dev --redirect
# certbot rewrites this into the TLS + HTTP->HTTPS-redirect form (Let's Encrypt
# managed lines), which is what runs in production at score.attach.dev.
#
# The upstream service binds 127.0.0.1:8757 (see attach-open-score.service) and
# enforces the Bearer token itself, so this proxy stays minimal. The trailing
# slash on proxy_pass strips no prefix here (location /), so paths pass through:
#   https://score.attach.dev/v0/verdict -> 127.0.0.1:8757/v0/verdict
#   https://score.attach.dev/health     -> 127.0.0.1:8757/health

server {
    listen 80;
    listen [::]:80;
    server_name score.attach.dev;

    location / {
        proxy_pass http://127.0.0.1:8757/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
